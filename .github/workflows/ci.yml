name: DepShield CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: depshield_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d depshield_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pip-audit
      - name: Apply migrations to dedicated PostgreSQL test database
        working-directory: backend
        env:
          DEPSHIELD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/depshield_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/depshield_test
        run: python -m alembic upgrade head
      - name: Backend unit and PostgreSQL integration tests
        working-directory: backend
        env:
          DEPSHIELD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/depshield_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/depshield_test
        run: python -m pytest -q
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests alembic ../scripts/create_admin.py ../scripts/package_project.py ../ci/security_policy_gate.py
      - name: Python dependency audit
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript and production build
        working-directory: frontend
        run: npm run build
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

  end-to-end:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create isolated CI-only environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_NAME=DepShield
          APP_ENV=development
          FRONTEND_URL=http://localhost:5173
          BACKEND_URL=http://localhost:8000
          DATABASE_URL=postgresql+psycopg://depshield:ci-only-password@db:5432/depshield
          POSTGRES_PASSWORD=ci-only-password
          APP_SECRET=ci-only-secret-not-for-deployment-000000000000000000
          SESSION_TTL_HOURS=12
          COOKIE_SECURE=false
          ALLOWED_ORIGINS=http://localhost:5173
          NVD_ENABLED=false
          OLLAMA_ENABLED=false
          SMTP_HOST=
          EOF
      - name: Start application services with migrations
        run: docker compose up -d --build
      - name: Wait for application health
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null && curl --fail --silent http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs api db worker frontend
          exit 1
      - name: Playwright full-stack browser journey
        working-directory: frontend
        env:
          DEPSHIELD_E2E_URL: http://localhost:5173
        run: npm run test:e2e
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Stop CI services and remove only CI-created volumes
        if: always()
        run: docker compose down -v
