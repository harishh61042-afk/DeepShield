name: DepShield policy gate

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: DepShield project UUID
        required: true
        type: string
      scan_id:
        description: Completed or partial DepShield scan UUID
        required: true
        type: string

permissions:
  contents: read

jobs:
  security-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Evaluate project policy
        env:
          DEPSHIELD_URL: ${{ vars.DEPSHIELD_URL }}
          DEPSHIELD_EMAIL: ${{ secrets.DEPSHIELD_CI_EMAIL }}
          DEPSHIELD_PASSWORD: ${{ secrets.DEPSHIELD_CI_PASSWORD }}
          DEPSHIELD_PROJECT_ID: ${{ inputs.project_id }}
          DEPSHIELD_SCAN_ID: ${{ inputs.scan_id }}
        run: python ci/security_policy_gate.py
